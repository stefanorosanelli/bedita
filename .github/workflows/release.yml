name: Release

on:
  pull_request_target:
    types: [closed]

jobs:
  release_job:
    uses: bedita/github-workflows/.github/workflows/release.yml@feat/output-release
    with:
      main_branch: '5-salix'
      dist_branches: '["5-salix","4-cactus"]'
      version_ini_path: plugins/BEdita/Core/config/bedita.ini
      version_ini_prefix: "[BEdita]\nversion = "

  # filter_tree:
  #   needs: release_job
  #   uses: ./.github/workflows/filter-components.yml
  #   secrets: inherit

  docker_push:
    runs-on: 'ubuntu-latest'
    needs: release_job
    steps:

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 'Output last 5 commits'
        run: 'git log -n 5'

      - name: Retrieve last tag on branch
        run: |
          echo "::set-output name=TAG_NAME::$(git describe --tags --abbrev=0 | cut -c 2-)"
        id: last_tag

      - name: Debug tag
        run: |
          echo last tag ${{ steps.last_tag.outputs.TAG_NAME }}

      - name: Debug output version
        run: |
          echo version var ${{ needs.release_job.outputs.version }}

      # - uses: mr-smithers-excellent/docker-build-push@v5
      #   with:
      #     image: bedita/bedita
      #     registry: docker.io
      #     tags: ${{ needs.release_job.outputs.version }}
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
